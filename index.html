<script>
const D=[
["Bago pa man maging isang bansa ang Pilipinas, lumaban na ang mga pamayanan sa sinumang nagbabantang umagaw ng kanilang lupa, paniniwala, at kalayaan. Hindi laging pakikidigma ang anyo nito; may pagkakataong ito ay pagtangging magbayad ng buwis, paglikas sa kabundukan, at pagpapanatili ng sariling ritwal. Sa paglipas ng panahon, ang mga karanasang ito ang humabi ng iisang damdamin ng pagiging Pilipino.",[
["Ano ang pinakaangkop na kahulugan ng pakikibaka batay sa talata?","Sama-samang pagtutol sa pang-aapi upang ipagtanggol ang kalayaan","Tahimik na pagtanggap sa pamamahala upang mapanatili ang kapayapaan ng bayan","Pansariling pag-iwas sa gulo upang mapangalagaan ang sariling kabuhayan","Pagtutuos ng mga pangkat upang makuha ang kapangyarihan sa pamahalaan"],
["Alin ang halimbawa ng pakikibakang walang armas ayon sa talata?","Sadyang hindi pagbibigay ng buwis na hinihingi ng mananakop","Pagsama sa hukbo ng mananakop upang magkaroon ng mataas na katungkulan","Pagpapalit ng relihiyon upang makuha ang pabor ng bagong pamahalaan","Pag-aangkat ng kalakal mula sa dayuhan upang mapalago ang kalakalan"],
["Ano ang naging bunga ng magkakatulad na karanasan ng paglaban?","Pagkabuo ng iisang damdamin ng pagkakakilanlan ng mga mamamayan","Pagkahati ng mga pamayanan dahil sa magkakaibang paraan ng pagtutol","Paglakas ng pagtitiwala ng mga katutubo sa kapangyarihan ng dayuhan","Pagtigil ng mga pamayanan sa pagpapanatili ng sariling kaugalian"],
["Bakit hindi masasabing pakikidigma lamang ang pakikibaka?","Dahil may mga anyo itong mapayapa at nakabatay sa kultura","Dahil ang tunay na pakikibaka ay nagsisimula lamang kapag may digmaan","Dahil ito ay ginagawa lamang ng mga pinunong may dalang sandata","Dahil ito ay laging nagwawakas sa agarang pagkamit ng kalayaan"],
["Alin ang pinakamaagang halimbawa ng pakikibaka ng mga katutubo sa dayuhan?","Pagtutol ni Lapu-Lapu sa hukbo ni Magellan sa Mactan","Pag-aalsa ni Francisco Dagohoy laban sa pamahalaang Kastila ng Bohol","Pag-aalsa ni Diego Silang laban sa pamamahala ng mga Kastila","Paghihimagsik ng Katipunan laban sa pamahalaang Espanyol"]]],
["Noong 1621, pinamunuan ni Tamblot sa Bohol ang pagbabalik ng mga tao sa sinaunang pananampalataya, samantalang sa Leyte ay tinalikuran ni Bankaw ang kasunduan sa mga Kastila at muling sumunod sa dating mga diyos. Noong 1649, sumiklab sa Samar ang paghihimagsik ni Agustin Sumuroy nang tutulan ang sapilitang pagpapadala ng mga kalalakihan upang magtrabaho sa mga barko sa Cavite.",[
["Ano ang pangunahing layunin nina Tamblot at Bankaw?","Ibalik ang katutubong pananampalatayang pinigilan ng mananakop","Makuha ang mataas na posisyon sa simbahang itinatag ng Espanya","Mapalawak ang kalakalan ng kanilang pamayanan sa mga dayuhan","Mapatupad ang batas ng kolonya sa mga liblib na pamayanan"],
["Ano ang ugat ng paghihimagsik ni Sumuroy?","Pagtutol sa sapilitang paggawa para sa kolonyal na pamahalaan","Pagtanggi sa pagbabayad ng labis na upa sa lupang sinasaka","Pagkabigo ng mga pinuno na makuha ang pabor ng mga prayle","Paglabag ng mga dayuhan sa kasunduang pangkalakalan"],
["Saang rehiyon naganap ang paghihimagsik ni Sumuroy?","Samar","Pangasinan","Cagayan","Zamboanga"],
["Anong uri ng kolektibong karanasan ang makikita sa tatlong pag-aalsa?","Pagtutol sa patakarang panrelihiyon at sapilitang paggawa ng kolonya","Pagsuporta ng mga katutubo sa lahat ng patakarang ipinataw ng Espanya","Pag-aaway ng magkakalapit na pamayanan para sa iisang teritoryo","Pagsisikap ng mga pinuno na makalikom ng yaman para sa sarili"],
["Bakit itinuturing na kolektibo ang mga pag-aalsang ito?","Dahil kumilos nang magkakasama ang maraming tao sa iisang layunin","Dahil iisang pinuno lamang ang nagpasya para sa lahat ng nasasakupan","Dahil sabay-sabay itong naganap sa lahat ng bahagi ng kapuluan","Dahil kabilang dito ang mga dayuhang tumulong sa mga katutubo"]]],
["Mula 1744 hanggang 1829, nanatiling malaya sa kapangyarihang Kastila ang mga Boholano sa pamumuno ni Francisco Dagohoy matapos tanggihan ng pari ang maayos na libing ng kaniyang kapatid na nasawi sa tungkulin. Noong 1762, nanguna si Diego Silang sa Ilocos laban sa pagsasamantala ng mga opisyal na Kastila. Noong 1841, itinatag ni Apolinario de la Cruz o Hermano Pule ang Cofradia de San Jose, na hindi pinahintulutan ng Simbahan dahil para ito sa mga katutubo.",[
["Gaano katagal tumagal ang pag-aalsa ni Dagohoy?","Humigit-kumulang walumpu't limang taon","Mahigit sa isang daan at dalawampung taon","Halos apatnapung taon","Wala pang sampung taon"],
["Ano ang nagpasiklab sa paghihimagsik ni Dagohoy?","Pagtangging bigyan ng maayos na libing ang kaniyang kapatid","Pagkakait sa kaniya ng posisyon sa pamahalaang panlalawigan","Pagtaas ng buwis na ipinataw sa mga Boholanong magsasaka","Pagpapatapon sa kaniya ng mga opisyal na Kastila"],
["Ano ang tinutulan ni Diego Silang sa Ilocos?","Pagsasamantala ng mga opisyal na Kastila sa mga Ilokano","Pagpasok ng mga dayuhang mangangalakal sa mga daungan","Pagbabawal sa paggamit ng wikang katutubo sa paaralan","Pagpapalawak ng simbahan sa mga lupain ng mga datu"],
["Bakit hindi pinahintulutan ang kapatiran ni Hermano Pule?","Dahil ayaw ng mga Kastila ang samahang panrelihiyon ng mga katutubo","Dahil lumabag ang kapatiran sa kautusan tungkol sa pagbabayad ng buwis","Dahil naglalayon itong palitan ang pananampalatayang Katoliko","Dahil walang sapat na kasapi upang mapanatili ang samahan"],
["Anong aral ang makukuha sa tatlong pinuno?","Napapahaba ng pagkakaisa ang laban kahit mas malakas ang kalaban","Nakakamit ang kalayaan sa pamamagitan ng iisang malaking labanan","Nagwawagi ang pag-aalsa kapag mas marami ang dalang sandata","Nababawasan ang pang-aapi kapag mas kakaunti ang lumalaban"]]],
["Sa Luzon, lumaki ang hidwaan ng mga magsasaka at may-ari ng lupa dahil sa sistema ng hacienda. Noong 1930s, itinatag ni Benigno Ramos ang Sakdal na bumatikos sa mataas na buwis at sa pamahalaan, at nag-alsa ito noong 1935. Hinikayat naman ng Colorum, na may halong pananampalataya, ang mahihirap na magbubukid. Noong 1942, nabuo ang Hukbalahap sa Gitnang Luzon upang labanan ang Hapon, at kalaunan ay nagtaguyod ng repormang agraryo.",[
["Ano ang ugat ng mga kilusang agraryo?","Di-pantay na pagmamay-ari ng lupa at pagsasamantala sa magsasaka","Kakulangan ng mga paaralan sa mga lalawigang malayo sa Maynila","Paglaganap ng mga dayuhang kalakal sa mga pamilihang bayan","Pagbaba ng presyo ng mga produktong inaangkat ng pamahalaan"],
["Sino ang nagtatag ng Sakdal?","Benigno Ramos","Apolinario Mabini","Crisanto Evangelista","Pedro Abad Santos"],
["Anong taon nag-alsa ang mga Sakdalista?","1935","1896","1942","1950"],
["Ano ang orihinal na layunin ng Hukbalahap?","Labanan ang mananakop na Hapon","Palitan ang Konstitusyon ng Komonwelt","Tutulan ang pamamahala ng mga Amerikano","Itatag ang sariling relihiyon ng mga magbubukid"],
["Alin ang pinakamainam na paglalarawan sa Colorum?","Kilusang pinaghalo ang paniniwalang panrelihiyon at hangaring makalaya sa kahirapan","Samahang pampulitika na tumatakbo sa halalan para sa mga magsasaka","Pangkat ng mga may-ari ng lupa na naghangad ng mas mataas na upa","Hukbong lihim na itinatag upang labanan ang mga Amerikano"]]],
["Noong 1880s, nagtungo sa Europa ang mga ilustradong Pilipino at gumamit ng panulat sa halip na sandata. Inilunsad sa Barcelona noong 1889 ang La Solidaridad, na pinamunuan muna ni Graciano Lopez Jaena at kalaunan ni Marcelo H. del Pilar. Kasama si Jose Rizal, na ang Noli Me Tangere ay inilathala noong 1887, hiniling nila ang pantay na karapatan, kinatawan sa Cortes, at pagbawas sa kapangyarihan ng mga prayle, hindi ang paghiwalay sa Espanya.",[
["Ano ang pangunahing sandata ng Kilusang Propaganda?","Panulat at mga akdang naglalantad ng katiwalian","Hukbong lihim na sumasalakay sa mga kuwartel","Sunud-sunod na welga ng mga manggagawa","Pagbabawal sa pagbabayad ng buwis ng bayan"],
["Ano ang pangalan ng pahayagan ng mga propagandista?","La Solidaridad","Kalayaan","Diariong Tagalog","El Filibusterismo"],
["Ano ang hiniling ng mga propagandista sa Espanya?","Pantay na karapatan at kinatawan sa pamahalaan","Ganap na paghiwalay at pagtatatag ng bagong bansa","Pagpapalit ng relihiyon ng lahat ng mamamayan","Pagbabalik ng mga lupang kinuha ng mga datu"],
["Sino ang pumalit kay Lopez Jaena bilang patnugot?","Marcelo H. del Pilar","Andres Bonifacio","Emilio Jacinto","Gregorio Aglipay"],
["Bakit hindi nagtagumpay ang mga repormang hiniling?","Hindi pinansin ng mga prayle at pamahalaang Kastila ang mga hiling","Hindi sumang-ayon ang mga Pilipino sa hinihinging pagbabago","Natakot ang mga propagandista na ituloy ang paglalathala","Pinigil ng mga Amerikano ang pagpapadala ng mga akda"]]],
["Dahil walang tugon sa mapayapang reporma, itinatag ni Andres Bonifacio ang Katipunan noong 1892 sa Tondo. Lihim ang samahan, may tatlong antas ng kasapi, at Kalayaan ang pahayagan nito. Nang matuklasan ng mga Kastila ang samahan noong Agosto 1896, nagpunit ng sedula ang mga Katipunero sa Pugad Lawin at nagsimula ang himagsikan. Noong 1898, ipinahayag ang kalayaan sa Kawit, Cavite sa pamumuno ni Emilio Aguinaldo.",[
["Ano ang dahilan ng pagtatag ng Katipunan?","Kawalan ng pagbabago matapos ang mapayapang paghiling ng reporma","Pagnanais ng mga Pilipino na makipag-ugnayan sa mga Amerikano","Pagtataguyod ng kalakalan ng mga ilustradong Pilipino sa Europa","Pagtutol sa pagbabawal ng pagbabasa ng mga nobela ni Rizal"],
["Sino ang nagtatag ng Katipunan?","Andres Bonifacio","Apolinario Mabini","Emilio Aguinaldo","Gregorio del Pilar"],
["Ano ang sinisimbolo ng pagpunit ng sedula sa Pugad Lawin?","Pagtatakwil sa pamamahala ng Espanya","Pagtanggi sa pakikipag-usap sa mga prayle","Pagbabayad ng utang sa pamahalaang Kastila","Pagsuko ng mga kasapi sa hukbong kolonyal"],
["Alin ang pahayagan ng Katipunan?","Kalayaan","La Solidaridad","El Heraldo","La Independencia"],
["Saan at kailan ipinahayag ang kalayaan ng Pilipinas?","Kawit, Cavite noong 1898","Tondo, Maynila noong 1892","Pugad Lawin noong 1896","Barcelona, Espanya noong 1889"]]],
["Hindi lahat ng tugon sa pananakop ay paglaban. Noong panahon ng mga Amerikano, maraming Pilipino ang nag-aral ng Ingles sa mga paaralang publiko sa tulong ng mga Thomasites at lumahok sa halalan at pamahalaang lokal. Noong panahon ng Hapon (1942-1945), may nagtanim sa bakuran at nagtinda sa palengke upang mabuhay, habang may nagpatuloy sa gerilya. Ang pakikiangkop ay pagtugon sa bagong kalagayan upang makaraos nang hindi nawawala ang sariling pagkakakilanlan.",[
["Ano ang pakikiangkop batay sa talata?","Pagbabago ng kilos at gawi upang makaraos sa bagong kalagayan","Pagtanggi sa lahat ng pagbabagong ipinataw ng mga mananakop","Pagtalikod sa sariling kultura upang tanggapin ang dayuhan","Pagsuko sa kapangyarihan upang makakuha ng mataas na posisyon"],
["Sino ang mga Thomasites?","Mga gurong Amerikano na nagturo sa mga Pilipino","Mga sundalong Amerikano na nagbantay sa mga bayan","Mga prayleng Kastila na nagturo ng pananampalataya","Mga opisyal na Amerikano na namahala sa kalakalan"],
["Alin ang halimbawa ng pakikiangkop sa panahon ng Hapon?","Pagtatanim sa bakuran upang magkaroon ng pagkain sa kakapusan","Pagbili ng mga imported na kalakal sa mga malalaking tindahan","Pagpapadala ng mga anak sa ibang bansa upang mag-aral","Pag-aangkat ng bigas mula sa mga karatig na bansa"],
["Paano naiiba ang pakikiangkop sa pakikibaka?","Hindi ito tuwirang paglaban kundi pag-aayos ng sarili upang mabuhay","Ito ay laging sumasalungat sa damdaming makabayan ng mamamayan","Ito ay ginagawa lamang ng mga mayayaman at may kapangyarihan","Ito ay panandaliang hakbang bago magsimula ng armadong laban"],
["Ano ang pinananatili ng mga Pilipino sa kabila ng pakikiangkop?","Sariling pagkakakilanlan at pagpapahalaga","Mga batas na ipinataw ng mananakop","Mga kaugaliang hiram sa dayuhan","Mga katungkulang ibinigay ng kolonya"]]],
["Dahil sa pagtanggap sa edukasyong Ingles, dumami ang Pilipinong marunong bumasa at sumulat, at lumitaw ang mga manunulat sa Ingles. Sa Komonwelt (1935), itinakda ng Konstitusyon ang paglinang ng wikang pambansa batay sa mga katutubong wika; noong 1937, napili ang Tagalog bilang batayan. Tinawag itong Pilipino noong 1959 at Filipino noong 1987. Pinalakas ng mga pagbabagong ito ang nasyonalismo at ang hangaring pamahalaan ang sariling bayan.",[
["Ano ang naging bunga ng edukasyong Ingles?","Paglawak ng bilang ng mga marunong bumasa at sumulat","Pagbaba ng interes ng mga mamamayan sa pag-aaral","Paghinto ng paglalathala ng mga akda sa katutubong wika","Pagtutol ng mga guro sa paggamit ng aklat na Amerikano"],
["Anong taon napili ang Tagalog bilang batayan ng wikang pambansa?","1937","1935","1959","1987"],
["Ano ang itinawag sa wikang pambansa noong 1959?","Pilipino","Filipino","Tagalog","Pambansa"],
["Ano ang epekto ng mga pagbabagong ito sa damdamin ng mga Pilipino?","Lumakas ang hangaring pamahalaan ang sariling bayan","Humina ang pagnanais na magkaroon ng sariling bansa","Lumawak ang pagtangkilik sa pamamahala ng ibang bansa","Nawala ang interes ng kabataan sa kasaysayan ng bayan"],
["Bakit mahalaga ang wikang pambansa sa kamalayang Pilipino?","Nagsisilbi itong tulay ng pagkakaunawaan at pagkakaisa","Pinapalitan nito ang lahat ng wikang ginagamit sa mga rehiyon","Pinipigilan nito ang pag-aaral ng mga banyagang wika","Ginagawa nitong magkakapareho ang kultura ng bawat pangkat"]]],
["Ang pakikibaka at pakikiangkop ay hindi magkaaway kundi magkatuwang na paraan ng pagpapanatili ng bayan. Sa harap ng mga hamon ngayon tulad ng maling impormasyon, kahirapan, at pagbabago ng klima, maaaring magpakita ang kabataan ng tapang sa pagsasabi ng totoo at kakayahang umangkop sa makabagong kasangkapan. Nagiging makabuluhan ang pagpapahalaga sa kasaysayan kapag isinasabuhay ang aral nito.",[
["Ano ang ugnayan ng pakikibaka at pakikiangkop ayon sa talata?","Magkatuwang na paraan upang mapanatili ang bayan","Magkasalungat na paraan na hindi maaaring gamitin nang sabay","Magkahiwalay na paraan na ginagamit sa magkaibang panahon","Magkatulad na paraan na may iisang kahulugan"],
["Alin ang halimbawa ng pakikibaka ng kabataan ngayon?","Matapang na pagpapabulaan sa maling impormasyon","Pagbabahagi ng balita nang hindi sinusuri ang pinagmulan","Pag-iwas sa talakayan upang hindi magkaroon ng away","Paghihintay sa iba na gumawa ng hakbang para sa bayan"],
["Alin ang halimbawa ng pakikiangkop ng kabataan ngayon?","Paggamit ng makabagong kasangkapan sa pag-aaral","Pagtanggi sa paggamit ng anumang bagong teknolohiya","Pagbabalik sa lumang paraan ng paggawa ng talaan","Pagtutol sa lahat ng pagbabago sa pamamaraan ng klase"],
["Kailan nagiging makabuluhan ang pagpapahalaga sa kasaysayan?","Kapag isinasabuhay ang aral nito","Kapag kabisado ang lahat ng petsa nito","Kapag madalas itong pinag-uusapan ng iba","Kapag may gantimpala sa pagsasaulo nito"],
["Alin ang hamon ngayon na binanggit sa talata?","Pagkalat ng maling impormasyon","Paglusob ng dayuhang hukbo","Sapilitang paggawa sa polo","Pagbabawal sa wikang katutubo"]]],
["Napansin ni Maya, isang estudyante, ang kumakalat na pekeng balita tungkol sa isang bayani. Sinuri niya ang pinagmulan nito, nagbahagi ng tamang datos sa klase, at gumawa ng infographic gamit ang isang bagong app. Nagkaroon siya ng lakas ng loob na itama ang mali at ginamit din niya ang makabagong teknolohiya para mas maunawaan ng kaklase ang aral.",[
["Alin sa ginawa ni Maya ang halimbawa ng pakikibaka?","Pagtutuwid sa maling balitang kumakalat","Paggawa ng infographic gamit ang app","Pag-aaral ng bagong kasangkapan sa klase","Pagtanggap ng datos mula sa kaklase"],
["Alin sa ginawa ni Maya ang halimbawa ng pakikiangkop?","Paggamit ng app upang gumawa ng infographic","Pagtutol sa pekeng balita sa harap ng klase","Pagbabahagi ng tamang datos sa mga kaibigan","Pagsusuri sa pinagmulan ng impormasyon"],
["Anong pagpapahalaga ang pinakanangibabaw kay Maya?","Katapatan at tapang","Kayamanan at kapangyarihan","Pagsunod sa nakararami","Pag-iwas sa pananagutan"],
["Ano ang unang tamang hakbang na ginawa ni Maya?","Pagsusuri sa pinagmulan ng balita","Pagbabahagi agad ng nabasang balita","Paghihintay sa tugon ng guro sa klase","Pagbura ng lahat ng kaugnay na post"],
["Anong aral ng mga Pilipino noon ang naisabuhay ni Maya?","Paglaban sa mali habang umaangkop sa pagbabago","Pananahimik upang maiwasan ang kaguluhan","Pagtangging gumamit ng anumang bagong paraan","Pag-asa sa ibang tao upang gumawa ng hakbang"]]]
];
